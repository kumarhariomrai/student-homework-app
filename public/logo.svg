# Sunbeam Convent School - Learning Portal

**Learning With Light** ✨

A modern, zero-cost Learning Management System (LMS) built for teachers, students, and parents.

## Features

### 👨‍🏫 Teacher Dashboard
- **Grade Management**: Log and track student marks easily
- **Material Sharing**: Upload lecture slides, PDFs, and homework sheets
- **Digital Noticeboard**: Publish announcements and important dates

### 🎓 Student Portal
- **Progress Tracker**: View grades, averages, and teacher feedback
- **Download Center**: Access study materials and assignments
- **Announcement Feed**: Stay updated with school notices

### 👨‍👩‍👧 Parent Portal
- **Academic Overview**: Monitor student progress and grades
- **Material Access**: Download study materials
- **School Notices**: Receive important announcements

## Tech Stack

- **Frontend**: React + Vite
- **Auth**: Firebase Authentication
- **Database**: Firestore
- **Storage**: Firebase Cloud Storage
- **Hosting**: Vercel
- **Design**: Premium gradient UI with Poppins typography

## Zero-Cost Setup

This app runs completely free on:
- Firebase free tier (auth, database, storage)
- Vercel free hosting
- Total cost: **$0/month** for ~100 students

## Quick Start

```bash
npm install
npm run dev
```

Then open http://localhost:5173

## Deployment

```bash
npm run build
# Deploy to Vercel
vercel
```

## Database Schema

### Users
```
users/{userId}
├── name: string
├── email: string
├── role: "student" | "teacher" | "parent"
└── createdAt: timestamp
```

### Grades
```
grades/{gradeId}
├── studentId: string
├── subject: string
├── score: number (0-100)
├── remark: string
└── createdAt: timestamp
```

### Materials
```
materials/{materialId}
├── title: string
├── description: string
├── type: "PDF" | "Lecture" | "Slides" | "Homework"
├── fileUrl: string
└── createdAt: timestamp
```

### Notices
```
notices/{noticeId}
├── title: string
├── content: string
├── createdByName: string
└── createdAt: timestamp
```

